<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIS To'lov</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Playfair+Display:wght@500;600&family=Libre+Caslon+Text:wght@400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Five fixed brand themes (not Telegram's colors), picked in Sozlamalar; html[data-theme] selects one.
   --hero-* style the Panel card, --num-* the large numbers, --s1..3 and --a1..3 the share and debt-age charts. */
:root,[data-theme=platinum]{
  color-scheme:dark;
  --bg:#0A0F1C;--bg-img:radial-gradient(120% 50% at 50% -8%,#1B2944 0%,#0A0F1C 60%,#06080F 100%);
  --card:#111A2C;--raised:#1C2840;--line:#1F2B44;--soft:#0D1424;
  --text:#E9EDF5;--hint:#8C97AD;
  --accent:#D3D9E4;--on-accent:#0C111C;--gold:#C7D2E8;
  --debt:#F08A80;--ok:#9FD8C0;--warn:#E8C27A;
  --hero-bg:linear-gradient(125deg,#F4F6FA 0%,#C9CFDA 22%,#EEF1F6 40%,#AEB6C4 62%,#E3E7EE 80%,#B7BECA 100%);
  --hero-text:#0C111C;--hero-hint:rgba(12,17,28,.62);--hero-frame:transparent;--hero-border:rgba(255,255,255,.5);--hero-bar:#0C111C;
  --num-font:Inter,sans-serif;--num-weight:300;
  --nav-bg:rgba(17,26,44,.92);--nav-on:#F2F5FA;--header:#0A0F1C;
  --chart:#C7D2E8;--s1:#E9EDF5;--s2:#7E93C2;--s3:#4A5D86;--a1:#E8C27A;--a2:#E9A178;--a3:#F08A80
}
[data-theme=noir]{
  color-scheme:dark;
  --bg:#0B0B0C;--bg-img:none;
  --card:#131314;--raised:#1E1D1B;--line:#262420;--soft:#101011;
  --text:#EDE7DA;--hint:#8E877A;
  --accent:#D6BD8A;--on-accent:#0B0B0C;--gold:#D6BD8A;
  --debt:#E0907F;--ok:#B9D3A8;--warn:#E3C27E;
  --hero-bg:linear-gradient(135deg,#2A2A2C 0%,#121213 45%,#1E1E20 70%,#0E0E0F 100%);
  --hero-text:#EDE7DA;--hero-hint:#8E877A;--hero-frame:transparent;--hero-border:#3A3529;--hero-bar:#D6BD8A;
  --num-font:Inter,sans-serif;--num-weight:200;
  --nav-bg:rgba(19,19,20,.94);--nav-on:#D6BD8A;--header:#0B0B0C;
  --chart:#D6BD8A;--s1:#D6BD8A;--s2:#8E877A;--s3:#4E4A42;--a1:#E3C27E;--a2:#E3A47E;--a3:#E0907F
}
[data-theme=ivory]{
  color-scheme:light;
  --bg:#F6F2EA;--bg-img:none;
  --card:#FFFDF8;--raised:#ECE5D8;--line:#E6DFD1;--soft:#EFE9DD;
  --text:#0F1B33;--hint:#7C7668;
  --accent:#0F1B33;--on-accent:#F4EFE4;--gold:#B8975A;
  --debt:#A23B2A;--ok:#2E7D5B;--warn:#A8761E;
  --hero-bg:linear-gradient(140deg,#13254A 0%,#0F1B33 60%,#1A2E58 100%);
  --hero-text:#F4EFE4;--hero-hint:#C9C2B0;--hero-frame:rgba(201,169,106,.4);--hero-border:#0F1B33;--hero-bar:#C9A96A;
  --num-font:"Playfair Display",Georgia,serif;--num-weight:500;
  --nav-bg:rgba(255,253,248,.95);--nav-on:#0F1B33;--header:#F6F2EA;
  --chart:#0F1B33;--s1:#0F1B33;--s2:#B8975A;--s3:#C9C2B0;--a1:#C9A96A;--a2:#C6703F;--a3:#A23B2A
}
[data-theme=emerald]{
  color-scheme:dark;
  --bg:#0C1F19;--bg-img:radial-gradient(120% 50% at 50% -5%,#173B30 0%,#0C1F19 55%,#08140F 100%);
  --card:#11281F;--raised:#1A3A2E;--line:#21402F;--soft:#0E231B;
  --text:#EFE9DB;--hint:#93A39A;
  --accent:#D2B57A;--on-accent:#0C1F19;--gold:#D2B57A;
  --debt:#E39B85;--ok:#9FD3B5;--warn:#E3C27E;
  --hero-bg:linear-gradient(135deg,#1F5A47 0%,#123A2E 50%,#1A4D3D 100%);
  --hero-text:#EFE9DB;--hero-hint:#B9C8BF;--hero-frame:transparent;--hero-border:rgba(210,181,122,.45);--hero-bar:#D2B57A;
  --num-font:"Libre Caslon Text",Georgia,serif;--num-weight:400;
  --nav-bg:rgba(8,20,15,.94);--nav-on:#D2B57A;--header:#0C1F19;
  --chart:#D2B57A;--s1:#D2B57A;--s2:#5FA78A;--s3:#93A39A;--a1:#E3C27E;--a2:#E3A47E;--a3:#E39B85
}
[data-theme=bordo]{
  color-scheme:dark;
  --bg:#250A11;--bg-img:radial-gradient(120% 50% at 50% -5%,#4A1623 0%,#250A11 55%,#16070B 100%);
  --card:#2E0F17;--raised:#401722;--line:#4A1D29;--soft:#2A0D14;
  --text:#F1E6E2;--hint:#B9A3A5;
  --accent:#D6B67A;--on-accent:#250A11;--gold:#D6B67A;
  --debt:#F2A08F;--ok:#A9D6B8;--warn:#E8C98A;
  --hero-bg:linear-gradient(135deg,#6E1E30 0%,#3F0F1B 55%,#5A1828 100%);
  --hero-text:#F1E6E2;--hero-hint:#D8BFC2;--hero-frame:transparent;--hero-border:rgba(214,182,122,.5);--hero-bar:#D6B67A;
  --num-font:"Playfair Display",Georgia,serif;--num-weight:500;
  --nav-bg:rgba(22,7,11,.94);--nav-on:#D6B67A;--header:#250A11;
  --chart:#D6B67A;--s1:#D6B67A;--s2:#C46A7E;--s3:#B9A3A5;--a1:#E8C98A;--a2:#E8A07E;--a3:#F2A08F
}
:root{
  --debt-soft:color-mix(in srgb,var(--debt) 14%,transparent);--ok-soft:color-mix(in srgb,var(--ok) 14%,transparent);
  --accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);
  --r-lg:18px;--r:14px;--r-sm:10px;--ease:cubic-bezier(.2,.8,.2,1);--fast:160ms;--mid:260ms
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{background-image:var(--bg-img);background-attachment:fixed;background-repeat:no-repeat}
.num{font-family:var(--num-font);font-weight:var(--num-weight);letter-spacing:-.01em}
body{font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:640px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
.screen{animation:in var(--mid) var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{font-size:18px;font-weight:700;display:block;line-height:1.1}.brand small{color:var(--hint);font-size:12.5px}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);display:grid;place-items:center;transition:transform var(--fast) var(--ease),background var(--fast)}
.iconbtn:active{transform:scale(.94)}
.spin .ic{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* dashboard */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{border-radius:var(--r);padding:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.kpi .l{font-size:12.5px;color:var(--hint)}
.kpi .v{font-size:22px;font-family:var(--num-font);font-weight:var(--num-weight);letter-spacing:-.01em;margin-top:4px;white-space:nowrap}
.kpi .d{font-size:12px;color:var(--hint);margin-top:1px}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;margin-bottom:10px;background:var(--hero-bg);color:var(--hero-text);border:1px solid var(--hero-border);box-shadow:0 16px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;inset:7px;border-radius:14px;border:1px solid var(--hero-frame);pointer-events:none}
.hero .cap{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--hero-hint);font-weight:600}
.hero .top3{display:flex;justify-content:space-between;align-items:center}
.hero .brandmark{font-weight:700;letter-spacing:.3em;font-size:12px}
.hero .sum{font-size:34px;line-height:1.1;margin:14px 0 2px;white-space:nowrap}
.hero .unit{font-size:12.5px;color:var(--hero-hint)}
.hero .track{height:3px;border-radius:2px;background:color-mix(in srgb,var(--hero-text) 18%,transparent);margin-top:14px}
.hero .track i{display:block;height:100%;border-radius:2px;background:var(--hero-bar)}
.hero .foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--hero-hint);margin-top:7px;letter-spacing:.04em}
.kpi .d.good{color:var(--ok)}
.card{border-radius:var(--r);padding:12px 14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.ct{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;margin-bottom:8px}
.ct small{font-size:12px;color:var(--hint);font-weight:500}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{display:flex;font-size:11px;color:var(--hint);margin-top:4px}.chart .ax span{flex:1;text-align:center}
.share{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--hint);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.age{display:grid;grid-template-columns:44px 1fr 28px;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.age .tr{height:8px;border-radius:4px;background:var(--line)}.age .tr i{display:block;height:100%;border-radius:4px}
.age b{text-align:right}
.toprow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:14px;min-height:44px}
.toprow:first-of-type{border-top:0}
.toprow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow b{color:var(--debt)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:6px 0;min-height:32px}
/* bottom navigation */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;max-width:616px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--nav-bg);border:1px solid var(--line);border-radius:22px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nav button{border:0;background:none;color:var(--hint);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;border-radius:16px}
.nav button[aria-current=page]{color:var(--nav-on);font-weight:600;background:color-mix(in srgb,var(--nav-on) 10%,transparent)}
/* settings: theme picker */
.theme{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--text);text-align:left}
.theme[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.theme .sw{width:52px;height:34px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.theme .ic{color:var(--accent)}
.nav .ic{width:22px;height:22px}
/* act and history */
.select{width:100%;min-height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 12px;font-size:16px}
.flabel{display:block;font-size:13px;color:var(--hint);font-weight:600;margin:12px 2px 6px}
.hist{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.hist .top2{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14.5px}
.hist .top2 span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .top2 b{color:var(--ok);white-space:nowrap}.hist.cancel .top2 b{color:var(--hint);text-decoration:line-through}
.hist .meta{white-space:normal}
.search{position:sticky;top:0;z-index:5;padding:8px 0 10px;background:var(--bg)}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:0 14px;min-height:48px;border:1.5px solid transparent;transition:border-color var(--fast)}
.field:focus-within{border-color:var(--accent)}
.field .ic{color:var(--hint)}
.field input{flex:1;border:0;outline:0;background:transparent;min-height:46px;font-size:16px}
.field input::placeholder{color:var(--hint)}
.seg{display:flex;gap:4px;padding:4px;margin-top:10px;border-radius:14px;background:var(--soft)}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--hint);font-weight:600;font-size:14px;transition:background var(--fast),color var(--fast)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--text)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-align:left;transition:transform var(--fast) var(--ease)}
.item:active{transform:scale(.985)}
.list>*{animation:in var(--mid) var(--ease) both}
.av{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;background:var(--raised);color:var(--text)}
.body{flex:1;min-width:0}
.name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--hint);font-size:13px;margin-top:1px}
.amt{text-align:right;flex:none}
.amt b{display:block;font-size:15.5px;font-weight:700;color:var(--debt)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.debt{background:var(--debt-soft);color:var(--debt)}
.pill .ic{width:14px;height:14px;stroke-width:2.5}
.chev{color:var(--hint)}
.head{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.head .av{width:48px;height:48px;font-size:16px}
.head h1{font-size:19px;margin:0;line-height:1.2;font-weight:700}
.sectitle{font-size:13px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}
.lic{display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-align:left;transition:transform var(--fast) var(--ease)}
.lic:active{transform:scale(.985)}
.lic .row{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.lic .row .body{min-width:min(100%,150px)}
.meta,.pill{white-space:nowrap}
.lic .name{white-space:normal}
.months{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mo{font-size:12.5px;padding:4px 9px;border-radius:8px;background:var(--debt-soft);color:var(--debt);font-weight:600}
.mo.more{background:var(--soft);color:var(--hint)}
.amountcard{background:var(--card);border-radius:var(--r-lg);padding:18px 16px}
.amountcard label{display:block;color:var(--hint);font-size:13px;font-weight:600;text-align:center}
.bigin{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 4px}
.bigin input{width:2ch;min-width:2ch;max-width:100%;border:0;outline:0;background:transparent;text-align:center;font-size:38px;font-family:var(--num-font);font-weight:var(--num-weight);letter-spacing:-.01em;caret-color:var(--accent);padding:0}
.bigin span{font-size:16px;color:var(--hint);font-weight:600}
.hintline{text-align:center;color:var(--hint);font-size:13px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.chip{min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;transition:transform var(--fast) var(--ease),background var(--fast)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.plan{background:var(--card);border-radius:var(--r-lg);padding:16px;margin-top:12px;animation:in var(--mid) var(--ease)}
.plan h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;font-weight:600}
.step{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.dot{width:28px;height:28px;border-radius:9px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.dot .ic{width:16px;height:16px;stroke-width:2.6}
.step .body small{color:var(--hint);font-size:12.5px}
.step b{font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;margin:12px 2px 0;font-size:13.5px;color:var(--hint)}
.note.bad{color:var(--debt)}.note .ic{width:18px;height:18px;margin-top:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:var(--r);font-weight:600;margin-top:10px;transition:transform var(--fast) var(--ease),opacity var(--fast)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--card);color:var(--text)}
.btn[disabled]{opacity:.5;pointer-events:none}
.done{text-align:center;background:var(--card);border-radius:var(--r-lg);padding:28px 18px 22px}
.check{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;background:var(--ok-soft);display:grid;place-items:center;color:var(--ok)}
.check svg{width:40px;height:40px;stroke-width:2.6}
.check path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done .sum{font-size:32px;font-family:var(--num-font);font-weight:var(--num-weight);letter-spacing:-.01em}
.done .who{margin-top:6px;font-weight:600}
.done .months{justify-content:center}
.done .mo{background:var(--ok-soft);color:var(--ok)}
.skel{height:68px;border-radius:var(--r);background:linear-gradient(90deg,var(--card) 25%,color-mix(in srgb,var(--hint) 10%,var(--card)) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite}
.skel.hero-s{height:150px;border-radius:var(--r-lg);margin-bottom:14px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--hint);padding:40px 16px}
.empty .ic{width:36px;height:36px;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.check path{stroke-dashoffset:0}}
</style>
</head>

<script src="akt.js"></script>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbztrlHtUAOOTjKiVOMHLMYYxwswEcies68fv75fHBgATEMr1u22e62ZJ6UV-tu6SIp4Yg/exec";
const tg = window.Telegram && Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
const app = document.getElementById("app");
const money = (v) => Math.round(+v || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const short = (v) => (v >= 1e6 ? (v / 1e6).toFixed(1).replace(".", ",").replace(",0", "") + " mln" : money(v));
const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',

      r.owed > 0 ? h("span", { class: "pill debt" }, money(r.owed)) : h("span", { class: "pill ok" }, icon("check"), "to'langan"), icon("chev", "chev")),
    r.partial ? h("div", { class: "note" }, icon("info"), r.partial.label + " qisman to'langan: " + money(r.partial.value) + " / " + money(r.monthly)) : null,
    r.unpaid.length ? h("div", { class: "months", "aria-label": "To'lanmagan oylar" }, r.unpaid.slice(0, 3).map((m) => h("span", { class: "mo" }, m)),
      r.unpaid.length > 3 ? h("span", { class: "mo more" }, "+" + (r.unpaid.length - 3) + " oy") : null) : null)));
  s.append(list);
}

function renderPay(s) {
  const r = clients.find((x) => x.row === view.row);
  backButton(() => go({ name: "client", company: view.company }));
  if (!r) return go({ name: "list" });
  s.append(h("div", { class: "head" }, avatar(r.company), h("div", { class: "body" }, h("h1", {}, r.type + " ×" + r.qty),
    h("div", { class: "meta" }, r.company))));
  const input = h("input", { id: "amt", inputmode: "numeric", autocomplete: "off", placeholder: "0", value: view.amount ? money(view.amount) : "", "aria-describedby": "amt-hint" });
  const planBox = h("div"), msg = h("div", { role: "status" });
  const amount = () => Number(String(input.value).replace(/\D/g, ""));
  // the field grows with the number, so "so'm" stays right next to it
  const fit = () => { input.style.width = Math.max(2, input.value.length + 0.6) + "ch"; };
  const quick = [];
  if (r.partial) quick.push(["Qoldiq", r.monthly - r.partial.value]);
  [1, 2, 3].filter((k) => k <= r.unpaid.length).forEach((k) => quick.push([k + " oy", k * r.monthly]));
  if (r.owed > 0 && !quick.some((x) => x[1] === r.owed)) quick.push(["Qarzni yopish", r.owed]);
  const chips = h("div", { class: "chips" });
  const drawChips = () => chips.replaceChildren(...quick.map(([label, v]) => h("button", { class: "chip", type: "button", "aria-pressed": String(amount() === v),
    onclick: () => { haptic("tap"); input.value = money(v); view.amount = v; fit(); drawChips(); reset(); calc(); } }, label)));
  const say = (text, bad) => msg.replaceChildren(text ? h("div", { class: "note" + (bad ? " bad" : "") }, icon(bad ? "alert" : "info"), text) : "");
  const reset = () => { view.plan = null; planBox.replaceChildren(); say(""); mainButton(amount() ? "Hisoblash" : null, calc); };
  input.addEventListener("input", () => { const v = amount(); input.value = v ? money(v) : ""; view.amount = v; fit(); drawChips(); reset(); });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { input.blur(); calc(); } });
  s.append(h("section", { class: "amountcard" }, h("label", { for: "amt" }, "To'langan summa"),
    h("div", { class: "bigin" }, input, h("span", {}, "so'm")),
    h("div", { class: "hintline", id: "amt-hint" }, "Oylik to'lov: " + money(r.monthly) + " so'm"), chips), planBox, msg);
  if (!tg) s.append(h("button", { class: "btn primary", onclick: () => (view.plan ? confirm() : calc()) }, "Hisoblash / Tasdiqlash"));
  fit(); drawChips(); reset();
  setTimeout(() => input.focus(), 300);

  async function calc() {
    if (busy) return;
    const v = amount();
    if (!v) return say("Summani kiriting yoki tez tugmalardan birini tanlang", true);
    busy = true; tg && tg.MainButton.showProgress(); say("Hisoblanmoqda…");
    try {
      const { plan } = await api("plan", { row: r.row, amount: v });
      view.plan = plan;
      planBox.replaceChildren(h("section", { class: "plan", "aria-label": "Belgilanadigan oylar" },
        h("h2", {}, h("span", {}, "Belgilanadi"), h("span", { style: "color:var(--ok)" }, money(v) + " so'm")),
        plan.writes.map((w) => h("div", { class: "step" }, h("div", { class: "dot" }, icon("check")),
          h("div", { class: "body" }, h("b", {}, w.label), w.prev ? h("small", {}, " · qoldiq yopiladi: " + money(w.prev) + " → " + money(w.neu)) : null),
          h("b", {}, "+" + money(w.paid))))));
      say("Tasdiqlamaguningizcha jadvalga hech narsa yozilmaydi");
      mainButton("Tasdiqlash · " + money(v) + " so'm", confirm);
      haptic("tap");
    } catch (e) { say(e.message, true); haptic("error"); mainButton("Hisoblash", calc); }
    busy = false; tg && tg.MainButton.hideProgress();
  }
  async function confirm() {
    if (busy || !view.plan) return;
    busy = true; tg && tg.MainButton.showProgress(); say("Yozilmoqda…");
    try {
      const res = await api("pay", { row: r.row, amount: view.plan.amount, expect: view.plan.writes.map((w) => ({ col: w.col, old: w.old })) });
      haptic("success");
      busy = false; tg && tg.MainButton.hideProgress();
      load(true);
      return go({ name: "done", res, company: view.company });
    } catch (e) { say(e.message, true); haptic("error"); }
    busy = false; tg && tg.MainButton.hideProgress();
  }
}

function renderDone(s) {
  const { res } = view;
  const msg = h("div", { role: "status" });
  const undo = h("button", { class: "btn ghost", onclick: async () => {
    if (busy) return; busy = true; undo.setAttribute("disabled", "");
    try { await api("undo", { op: res.op }); haptic("warning"); msg.replaceChildren(h("div", { class: "note" }, icon("undo"), "Bekor qilindi: kataklar oldingi holatiga qaytdi")); undo.remove(); load(true); }
    catch (e) { msg.replaceChildren(h("div", { class: "note bad" }, icon("alert"), e.message)); undo.removeAttribute("disabled"); }
    busy = false;
  } }, icon("undo"), "Bekor qilish");
  const check = h("div", { class: "check", "aria-hidden": "true" });
  check.innerHTML = '<svg viewBox="0 0 24 24" class="ic"><path d="M20 6 9 17l-5-5"/></svg>';
  s.append(h("section", { class: "done", "aria-label": "To'lov yozildi" }, check, h("div", { class: "meta" }, "To'lov yozildi"),
    h("div", { class: "sum" }, money(res.amount) + " so'm"), h("div", { class: "who" }, res.company + " — " + res.type),
    h("div", { class: "months" }, res.months.map((m) => h("span", { class: "mo" }, m))),
    h("div", { class: "note", style: "justify-content:center" }, icon("check"), "Google Sheets'ga yozildi, xodimlarga xabar ketdi")), msg, undo);
  mainButton("Yangi to'lov", () => go({ name: "topay", q: "" }));
  if (!tg) s.append(h("button", { class: "btn primary", onclick: () => go({ name: "topay", q: "" }) }, icon("plus"), "Yangi to'lov"));
}

let excelP = null;
const excel = () => (excelP = excelP || new Promise((ok, bad) => {
  if (window.ExcelJS) return ok(window.ExcelJS);
  const sc = document.createElement("script");
  sc.src = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
  sc.onload = () => (window.ExcelJS ? ok(window.ExcelJS) : bad(new Error("Excel kutubxonasi yuklanmadi")));
  sc.onerror = () => { sc.remove(); bad(new Error("Excel kutubxonasi yuklanmadi — internetni tekshiring")); };
  document.head.appendChild(sc);
}).catch((e) => { excelP = null; throw e; }));
const toB64 = (buf) => { const b = new Uint8Array(buf); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

function renderAkt(s) {
  topBar(s, "Akt sverka", "Excel fayl bot chatiga keladi");
  if (!dashData) return s.append(h("div", { class: "note" + (dashErr ? " bad" : "") }, icon("info"),
    dashErr ? "Akt uchun serverdagi Apps Script yangilanishi kerak (" + dashErr + ")." : "Ma'lumot yuklanmoqda…"));
  const cos = [...new Set(dashData.lines.map((r) => r.company))].sort((a, b) => a.localeCompare(b));
  const top = companies().find((c) => c.owed > 0);
  view.aktCo = view.aktCo || (top ? top.company : cos[0]);
  const coSel = h("select", { class: "select", id: "akt-co", onchange: () => (view.aktCo = coSel.value) }, cos.map((c) => h("option", { value: c }, c)));
  coSel.value = view.aktCo;
  const years = [...new Set(dashData.lines.flatMap((r) => Object.keys(r).filter((k) => /^m\d{4}_\d{2}$/.test(k) && r[k] > 0).map((k) => Number(k.slice(1, 5)))))];
  const now = new Date().getFullYear();
  if (years.indexOf(now) < 0) years.push(now);
  const ySel = h("select", { class: "select", id: "akt-y" }, years.sort().map((y) => h("option", { value: String(y) }, y + "-yil")));
  ySel.value = String(now);
  const msg = h("div", { role: "status" });
  const say = (t, bad) => msg.replaceChildren(t ? h("div", { class: "note" + (bad ? " bad" : "") }, icon(bad ? "alert" : "info"), t) : "");
  async function send(list, label) {
    if (busy) return;
    busy = true; one.setAttribute("disabled", ""); every.setAttribute("disabled", "");
    try {
      say("Tayyorlanmoqda…");
      const year = Number(ySel.value), ExcelJS = await excel();
      const acts = list.map((co) => window.bkAkt.buildAct(dashData.lines, [], co, year)).filter((a) => list.length === 1 || a.docs.length || Math.round(a.opening));
      const buf = await window.bkAkt.workbook(ExcelJS, acts);
      say("Telegram'ga yuborilmoqda…");
      await api("sendAkt", { filename: "Akt sverka - " + window.bkAkt.safeFile(label) + " - " + year + ".xlsx", b64: toB64(buf) });
      haptic("success");
      say("Fayl bot chatiga yuborildi. Mini App'ni yopib, chatdan oching.");
    } catch (e) { haptic("error"); say(e.message, true); }
    busy = false; one.removeAttribute("disabled"); every.removeAttribute("disabled");
  }
  const one = h("button", { class: "btn primary", type: "button", onclick: () => send([coSel.value], coSel.value) }, icon("send"), "Mijoz aktini yuborish");
  const every = h("button", { class: "btn ghost", type: "button", onclick: () => send(cos, "barcha mijozlar") }, icon("file"), "Barcha mijozlar (bitta fayl)");
  s.append(h("section", { class: "card" },
    h("label", { class: "flabel", for: "akt-co", style: "margin-top:0" }, "Mijoz"), coSel,
    h("label", { class: "flabel", for: "akt-y" }, "Yil"), ySel, one, every), msg,
    h("div", { class: "note" }, icon("info"), "Akt Google Sheets'dagi oylar bo'yicha tuziladi: har oy schyot-faktura, to'langan oylar «Оплата». Yakuniy qoldiq jadvaldagi «Yana to'lash kerak» bilan bir xil."));
}

function renderHistory(s) {
  topBar(s, "Tarix", "So'nggi kiritilgan to'lovlar");
  if (!dashData) return s.append(h("div", { class: "note" + (dashErr ? " bad" : "") }, icon("info"),
    dashErr ? "Tarix uchun serverdagi Apps Script yangilanishi kerak (" + dashErr + ")." : "Ma'lumot yuklanmoqda…"));
  const groups = [];
  dashData.history.forEach((r) => {
    const key = [r.company, r.type, r.at, r.who, r.note].join("|"), m = /^(\d{4})-(\d{2})$/.exec(String(r.month));
    const label = m ? UZM[Number(m[2]) - 1] + " " + m[1] : String(r.month), g = groups[groups.length - 1];
    if (g && g.key === key) { g.months.unshift(label); g.amount += r.amount; return; }
    groups.push({ key, company: r.company, type: r.type, at: r.at, who: String(r.who).replace(/\s*\(mini app\)$/, ""), note: String(r.note || "").toLowerCase(), months: [label], amount: r.amount });
  });
  const src = (note) => (note.indexOf("mini app") === 0 ? "Mini App" : note.indexOf("sayt") === 0 ? "sayt" : "bot");
  s.append(h("div", { class: "list" }, groups.length ? groups.map((g, i) => h("div", { class: "hist" + (g.note.indexOf("bekor") >= 0 ? " cancel" : ""), style: `animation-delay:${Math.min(i, 10) * 25}ms` },
    h("div", { class: "top2" }, h("span", {}, g.company), h("b", {}, (g.amount < 0 ? "−" : "+") + money(Math.abs(g.amount)))),
    h("div", { class: "meta" }, g.type + " · " + g.months.join(", ") + (g.note.indexOf("bekor") >= 0 ? " · bekor qilingan" : "")),
    h("div", { class: "meta" }, g.at + " · " + g.who + " · " + src(g.note))))
    : [h("div", { class: "empty" }, icon("inbox"), h("div", {}, "Hali to'lov kiritilmagan"))]));
}

async function load(quiet) {
  if (!quiet) {
    const saved = readCache();
    if (saved) { clients = saved.clients; dashData = saved.dash; stale = true; render(); quiet = true; }
    else { const s = h("div", { class: "screen" }); topBar(s, "Dashboard", "Yuklanmoqda…"); s.append(h("div", { class: "skel hero-s" }), h("div", { class: "list" }, [1, 2, 3, 4].map(() => h("div", { class: "skel" })))); app.replaceChildren(s); }
  }
  // a fresh copy replaces the saved one on screen, unless the user is typing in a field
  const redraw = () => { if (isTab(view.name) && !(document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))) render(); };
  try {
    const [c, d] = await Promise.all([api("clients"), api("dash").catch((e) => { dashErr = e.message; return null; })]);
    clients = c.clients;
    if (d) { dashData = { totals: d.totals, lines: d.lines, history: d.history }; dashErr = ""; }
    const wasStale = stale;
    stale = false;
    writeCache();
    if (!quiet) render(); else if (wasStale) redraw();
  } catch (e) {
    const wasStale = stale;
    stale = false;
    if (/Ruxsat|imzo|Sessiya/.test(e.message)) { dropCache(); clients = []; dashData = null; quiet = false; }
    else if (wasStale) { redraw(); return; }
    if (quiet) return;
    const s = h("div", { class: "screen" }); topBar(s);
    s.append(h("div", { class: "empty" }, icon("alert"), h("div", {}, e.message)), h("button", { class: "btn primary", onclick: () => load() }, icon("refresh"), "Qayta urinish"));
    app.replaceChildren(s);
  }
}

if (tg) { tg.ready(); tg.expand(); }
loadTheme();
if (!inTelegram) {
  const s = h("div", { class: "screen" }); topBar(s);
  s.append(h("div", { class: "empty" }, icon("info"), h("div", {}, "Bu sahifa faqat Telegram ichida ishlaydi: @bis_tolov_bot → «To'lov kiritish»")));
  app.replaceChildren(s);
} else load();
</script>
